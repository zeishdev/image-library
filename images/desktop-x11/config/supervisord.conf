[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

# ── System D-Bus daemon (GTK app state / xfce components expect one) ────────
[program:dbus]
command=dbus-daemon --system --nofork --nopidfile
autorestart=true
priority=100
startsecs=1
stdout_logfile=/var/log/supervisor/dbus.log
stderr_logfile=/var/log/supervisor/dbus.log

# ── Xvfb: the headless X server for DISPLAY :1 ──────────────────────────────
# +extension XTEST is REQUIRED — sandboxd's x11 module fails its capability
# probe (no pointer/keyboard/drag) without it. -ac disables X access control
# so sandboxd (and zeish-chrome) need no XAUTHORITY. RANDR is what lets the
# desktop report/resize its geometry; -noreset keeps the server up when the
# last client disconnects.
[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 %(ENV_VNC_RESOLUTION)sx%(ENV_VNC_DEPTH)s -ac +extension RANDR +extension XTEST +extension GLX -noreset
autorestart=true
priority=150
startsecs=2
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.log

# ── Window manager (stand-alone xfwm4, no panel/session) ───────────────────
# Every unit below the X server blocks on `xdpyinfo -display :1` succeeding
# rather than a flat sleep — that is the startup-ordering primitive in this
# image. xfwm4's own compositor is disabled; picom does compositing.
[program:xfwm4]
command=bash -c "until xdpyinfo -display :1 >/dev/null 2>&1; do sleep 0.2; done; xsetroot -solid '#1e1e2e' 2>/dev/null || true; exec xfwm4 --compositor=off"
environment=DISPLAY=":1",HOME="%(ENV_HOME)s",USER="%(ENV_USER)s"
autorestart=true
priority=200
startsecs=2
stdout_logfile=/var/log/supervisor/xfwm4.log
stderr_logfile=/var/log/supervisor/xfwm4.log

# ── Compositor (xrender backend — no GLX/DRI in a headless container) ──────
[program:picom]
command=bash -c "until xdpyinfo -display :1 >/dev/null 2>&1; do sleep 0.2; done; exec picom --backend xrender"
environment=DISPLAY=":1",HOME="%(ENV_HOME)s",USER="%(ENV_USER)s"
autorestart=true
priority=210
startsecs=2
startretries=10
stdout_logfile=/var/log/supervisor/picom.log
stderr_logfile=/var/log/supervisor/picom.log

# ── x11vnc: captures :1 over RFB, loopback only ────────────────────────────
# -localhost binds 127.0.0.1; websockify below is the external face.
[program:x11vnc]
command=bash -c "until xdpyinfo -display :1 >/dev/null 2>&1; do sleep 0.2; done; exec x11vnc -display :1 -forever -shared -nopw -rfbport %(ENV_VNC_PORT)s -localhost"
environment=DISPLAY=":1"
autorestart=true
priority=300
startsecs=5
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.log

# ── websockify: noVNC static files + WebSocket→VNC bridge ─────────────────
[program:websockify]
command=/usr/local/bin/websockify-fork
    --web /opt/novnc
    --heartbeat=30
    0.0.0.0:%(ENV_PROXY_PORT)s
    127.0.0.1:%(ENV_VNC_PORT)s
autorestart=true
priority=400
startsecs=5
stdout_logfile=/var/log/supervisor/websockify.log
stderr_logfile=/var/log/supervisor/websockify.log

# NOTE: sandboxd is intentionally NOT supervised here. initd (PID 1) owns the
# sandboxd lifecycle on every image — it sidecar-starts the injected
# /usr/local/sbin/sandboxd with RestartSandboxd hot-update support, and
# forwards DISPLAY / XAUTHORITY / XDG_RUNTIME_DIR / SANDBOXD_* from this
# image's ENV into it. A supervisord copy would be a second instance
# colliding on :8899 / :8900 / :22. This image only provides the X11 desktop
# and zeish-chrome; keep DISPLAY=:1 and XDG_RUNTIME_DIR in the image ENV so
# initd's allowlist forwards them.
